apiVersion: apps/v1
kind: Deployment
metadata:
  name: asset-manager-api
  namespace: asset-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: asset-manager-api
  template:
    metadata:
      labels:
        app: asset-manager-api
    spec:
      imagePullSecrets:
        - name: finspot-registry
      containers:
        - name: api
          image: fs-le-dev-harbor.finspot.in/argus/api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 4000
          env:
            - name: NODE_ENV
              value: production
            - name: API_PORT
              value: "4000"
            - name: PG_HOST
              value: asset-manager-postgres
            - name: PG_PORT
              value: "5432"
            - name: PG_DATABASE
              value: argus
            - name: PG_USER
              value: argus
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: asset-manager-secrets
                  key: PG_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: asset-manager-secrets
                  key: JWT_SECRET
            - name: CORS_ORIGIN
              value: "*"
            - name: AUTH_BYPASS
              value: "false"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: asset-manager-api
  namespace: asset-manager
spec:
  type: NodePort
  selector:
    app: asset-manager-api
  ports:
    - port: 4000
      targetPort: 4000
      nodePort: 30400
