apiVersion: v1
kind: PersistentVolume
metadata:
  name: asset-manager-postgres-pv
spec:
  capacity:
    storage: 5Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: asset-manager-manual
  hostPath:
    path: /data/asset-manager/postgres
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: asset-manager-postgres-pvc
  namespace: asset-manager
spec:
  storageClassName: asset-manager-manual
  volumeName: asset-manager-postgres-pv
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: asset-manager-postgres
  namespace: asset-manager
spec:
  serviceName: asset-manager-postgres
  replicas: 1
  selector:
    matchLabels:
      app: asset-manager-postgres
  template:
    metadata:
      labels:
        app: asset-manager-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_USER
              value: argus
            - name: POSTGRES_DB
              value: argus
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: asset-manager-secrets
                  key: PG_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: [pg_isready, -U, argus, -d, argus]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: [pg_isready, -U, argus, -d, argus]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: asset-manager-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: asset-manager-postgres
  namespace: asset-manager
spec:
  selector:
    app: asset-manager-postgres
  ports:
    - port: 5432
      targetPort: 5432
