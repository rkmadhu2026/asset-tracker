apiVersion: v1
kind: ConfigMap
metadata:
  name: asset-manager-web-nginx
  namespace: asset-manager
data:
  default.conf: |
    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        gzip on;
        gzip_types text/plain text/css application/javascript application/json image/svg+xml;

        location /api/ {
            proxy_pass http://asset-manager-api:4000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        location / {
            try_files $uri /index.html;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: asset-manager-web
  namespace: asset-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: asset-manager-web
  template:
    metadata:
      labels:
        app: asset-manager-web
    spec:
      imagePullSecrets:
        - name: finspot-registry
      containers:
        - name: web
          image: fs-le-dev-harbor.finspot.in/argus/web:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: nginx-conf
          configMap:
            name: asset-manager-web-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: asset-manager-web
  namespace: asset-manager
spec:
  type: NodePort
  selector:
    app: asset-manager-web
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30082
